# Shared analyzer settings for app/, server/, and packages/api_contract/.
# Each package includes this file with `include: ../analysis_options.yaml`
# (or ../../ from packages/) and adds its own rules below the include.
# The lint set comes from package:lints (BSD-3-Clause), so every package
# needs `lints` as a dev dependency (flutter_lints also brings it in).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
