name: board_game_collector
description: "Board Game Collector app (placeholder name until PRD Q1 is answered)."
publish_to: 'none'

# build-name becomes versionName (Android) and CFBundleShortVersionString (iOS);
# build-number becomes versionCode and CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Licenses are checked before adding a package (MIT, BSD, or Apache 2.0 only).
# The list with licenses lives in docs/handoffs/T-012.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/app_en.arb
  # (settings in l10n.yaml).
  generate: true
