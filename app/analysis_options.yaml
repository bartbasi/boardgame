# App analyzer settings. The shared strict settings (strict-casts,
# strict-inference, strict-raw-types, package:lints recommended) come from the
# repo root file (docs/decisions.md, T-006). flutter_lints adds the Flutter
# specific rules on top.
include:
  - ../analysis_options.yaml
  - package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Generated by `flutter gen-l10n`.
    - lib/l10n/app_localizations*.dart
    # Source fixtures read as text by the architecture test. Some contain
    # imports of packages that are not dependencies, on purpose.
    - test/fixtures/architecture/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
